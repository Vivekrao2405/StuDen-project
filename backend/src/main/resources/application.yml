server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: studen-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:studen_db}
    username: ${DB_USERNAME:studen_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # A couple MB of headroom above app.image.max-size-mb so Spring's own
      # request-size rejection never fires before our friendlier validation does.
      max-file-size: ${MAX_IMAGE_SIZE_MB:5}MB
      max-request-size: 12MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # One origin, or a comma-separated list (e.g. local dev + the deployed frontend).
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  public-profile:
    base-url: ${PUBLIC_PROFILE_BASE_URL:https://studen.app/u}
  image:
    # Cover photos only need to look good at a few hundred px wide; 5MB comfortably
    # covers an un-optimized phone photo without letting someone upload something huge.
    max-size-mb: ${MAX_IMAGE_SIZE_MB:5}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Public callers only get overall UP/DOWN — component details (DB host, errors,
      # etc.) are never exposed. The aggregate status still reflects DB connectivity.
      show-details: never
