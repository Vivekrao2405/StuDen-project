server:
  port: ${SERVER_PORT:8080}
  # The production deployment sits behind a reverse proxy that terminates TLS and forwards plain
  # HTTP internally, so without this, Spring sees every request as insecure — Spring Security's
  # HSTS header only ever gets written for requests it detects as HTTPS, and the auth rate
  # limiter's per-IP tracking would key off the proxy's address instead of the real client's.
  # Safe locally too: with no proxy in front, there's nothing to trust and getRemoteAddr() is
  # unaffected.
  forward-headers-strategy: framework

spring:
  application:
    name: studen-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:studen_db}
    username: ${DB_USERNAME:studen_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    # Off by default — this was hardcoded `true` and running in production, adding real
    # per-request logging overhead on top of every query. Set JPA_SHOW_SQL=true locally when
    # you need to eyeball generated SQL (e.g. verifying an N+1 fix actually batches).
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}
        # Batches lazy collection/association loads (Project.skills, Project.links, and any
        # other lazy relation touched in a loop) into grouped IN-clause queries instead of one
        # query per row — the single highest-leverage fix for the N+1 patterns in the showcase
        # list/public-profile endpoints.
        default_batch_fetch_size: 20
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # This is a single app-wide ceiling shared by every multipart endpoint, so it must fit the
      # largest thing anyone uploads (project videos) — individual per-type limits (images 5MB,
      # videos app.video.max-size-mb) are enforced by ImageValidator/VideoValidator afterward, not
      # by this value. A couple MB of headroom above the video limit so Spring's own
      # request-size rejection never fires before our friendlier validation does.
      max-file-size: ${MAX_VIDEO_SIZE_MB:50}MB
      max-request-size: 60MB

app:
  jwt:
    secret: ${JWT_SECRET}
    # Short-lived on purpose: the frontend silently exchanges an expired access token for a new one
    # via POST /api/v1/auth/refresh (see AuthController), so a short access-token lifetime bounds
    # how long a leaked/stolen access token stays usable without forcing the user to re-login. The
    # actual persistent session lives in refresh-expiration-ms below.
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    # 30 days, sliding: every successful /refresh call rotates and re-extends it, so a user who
    # opens the app at least once a month never sees the login screen again on their own account.
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
  security:
    auth-rate-limit:
      # Per-IP, across register+login combined. Generous enough for a legitimate burst (a
      # family/office sharing one IP, a few mistyped-password retries) while still capping
      # automated credential-stuffing/registration-spam far below what a real attack needs.
      max-requests: ${AUTH_RATE_LIMIT_MAX_REQUESTS:30}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
  cors:
    # One origin, or a comma-separated list (e.g. local dev + the deployed frontend).
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  public-profile:
    base-url: ${PUBLIC_PROFILE_BASE_URL:https://studen.app/u}
  image:
    # Cover photos only need to look good at a few hundred px wide; 5MB comfortably
    # covers an un-optimized phone photo without letting someone upload something huge.
    max-size-mb: ${MAX_IMAGE_SIZE_MB:5}
  video:
    max-size-mb: ${MAX_VIDEO_SIZE_MB:50}
  project:
    # Sensible defaults to protect the platform — configurable per-environment, never hardcoded
    # at the call sites.
    max-projects-per-student: ${MAX_PROJECTS_PER_STUDENT:20}
    max-images-per-project: ${MAX_IMAGES_PER_PROJECT:10}
    max-videos-per-project: ${MAX_VIDEOS_PER_PROJECT:3}
  service:
    max-services-per-student: ${MAX_SERVICES_PER_STUDENT:20}
    max-images-per-service: ${MAX_IMAGES_PER_SERVICE:10}
    max-videos-per-service: ${MAX_VIDEOS_PER_SERVICE:3}
  booking:
    # Per-requester spam guard for service requests — a simple repository count-in-window check
    # (same idiom as app.service.max-services-per-student), not a filter.
    max-requests-per-window: ${MAX_SERVICE_REQUESTS_PER_WINDOW:10}
    rate-limit-window-minutes: ${SERVICE_REQUEST_RATE_LIMIT_WINDOW_MINUTES:60}
  messaging:
    # Same per-user count-in-window idiom as app.booking.* — messages are sent far more often
    # than service requests in normal use, hence the shorter window and higher cap.
    max-messages-per-window: ${MAX_MESSAGES_PER_WINDOW:30}
    rate-limit-window-minutes: ${MESSAGE_RATE_LIMIT_WINDOW_MINUTES:1}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Public callers only get overall UP/DOWN — component details (DB host, errors,
      # etc.) are never exposed. The aggregate status still reflects DB connectivity.
      show-details: never
