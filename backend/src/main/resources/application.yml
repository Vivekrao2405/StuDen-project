server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: studen-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:studen_db}
    username: ${DB_USERNAME:studen_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # One origin, or a comma-separated list (e.g. local dev + the deployed frontend).
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  public-profile:
    base-url: ${PUBLIC_PROFILE_BASE_URL:https://studen.app/u}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Public callers only get overall UP/DOWN — component details (DB host, errors,
      # etc.) are never exposed. The aggregate status still reflects DB connectivity.
      show-details: never
